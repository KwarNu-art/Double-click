name: Build Double-Click

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        shell: bash
        run: |
          brew install ldid dpkg
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install Theos
        shell: bash
        run: |
          THEOS_DIR="${RUNNER_TEMP}/theos"
          rm -rf "$THEOS_DIR"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS_DIR"
          rm -rf "$THEOS_DIR/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS_DIR/sdks"
          echo "THEOS=$THEOS_DIR" >> "$GITHUB_ENV"

      - name: Build Rootful Package (checkra1n / unc0ver / Odyssey)
        shell: bash
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Build Rootless Package (palera1n / Dopamine)
        shell: bash
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package contents
        shell: bash
        run: |
          set -e
          rm -rf verify && mkdir -p verify
          for deb in packages/*.deb; do
            echo "== $deb"
            rm -rf verify/x verify/ctl && mkdir verify/x verify/ctl
            dpkg-deb -x "$deb" verify/x
            dpkg-deb -e "$deb" verify/ctl
            app=$(find verify/x -name DoubleClickLock.app -type d | head -1)
            dylib=$(find verify/x -name DoubleClick.dylib | head -1)
            filter=$(find verify/x -name DoubleClick.plist -path "*DynamicLibraries*" | head -1)
            prefs=$(find verify/x -name DoubleClickPrefs.bundle -type d | head -1)
            test -n "$app" || { echo "Lock Screen app missing"; exit 1; }
            test -n "$dylib" || { echo "tweak dylib missing"; exit 1; }
            test -n "$filter" || { echo "tweak filter plist missing"; exit 1; }
            test -n "$prefs" || { echo "settings bundle missing"; exit 1; }
            test -f "$app/Info.plist" || { echo "app Info.plist missing"; exit 1; }
            test -x "$app/DoubleClickLock" || { echo "app executable missing"; exit 1; }
            ls "$app" | grep -q "AppIcon60x60@3x.png" || { echo "app icon missing"; exit 1; }
            plutil -lint "$app/Info.plist"
            test -f "$prefs/Root.plist" || { echo "settings Root.plist missing"; exit 1; }
            test -f "$prefs/DoubleClickPrefs" || { echo "settings binary missing"; exit 1; }
            ls -R "$app" | head -30
          done

      - name: Collect DEB files
        shell: bash
        run: |
          mkdir -p output_deb
          find packages -name "*.deb" -exec cp {} output_deb/ \;
          ls -la output_deb/

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Double-Click-deb
          path: output_deb/*.deb
          if-no-files-found: error
